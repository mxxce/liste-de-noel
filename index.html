<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ma Liste de Noël 🎄</title>
    
    <!-- Tailwind CSS pour le style responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Polices Google : Playfair Display pour l'élégance, Inter pour la lisibilité -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Configuration personnalisée de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Styles additionnels personnalisés */
        html { -webkit-text-size-adjust: 100%; }

        body {
            /* Un beau dégradé de nuit d'hiver */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) fixed;
            color: #f8fafc;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            /* Marges de sécurité (encoche, barres système sur mobile) */
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* L'effet de verre dépoli pour les cartes (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            min-width: 0; /* évite qu'un contenu long fasse déborder la grille */
        }

        /* Survol uniquement sur les appareils qui en ont un (pas de "hover collant" sur mobile) */
        @media (hover: hover) and (pointer: fine) {
            .glass-card:hover {
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(234, 179, 8, 0.3); /* Bordure dorée au survol */
                transform: translateY(-5px);
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), 0 0 20px rgba(234, 179, 8, 0.1);
            }
        }

        /* Conteneur d'image strict pour éviter tout problème de recadrage */
        .gift-image-container {
            width: 100%;
            height: 250px;
            flex-shrink: 0; /* Empêche la carte d'écraser l'image */
            overflow: hidden;
            position: relative;
        }
        
        .gift-image {
            width: 100%;
            height: 100%;
            object-fit: cover !important; /* Force le remplissage sans déformation */
            object-position: center;
            display: block;
            transition: transform 0.5s ease;
        }
        
        /* Animation de zoom au survol */
        .group:hover .gift-image {
            transform: scale(1.1);
        }

        /* Canvas de neige fixé en fond */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Permet de cliquer à travers la neige */
            z-index: 0;
        }

        /* Contenu principal mis en avant par rapport à la neige */
        .content-wrapper {
            position: relative;
            z-index: 10;
        }

        /* Respect de la préférence "réduire les animations" */
        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-up { animation: none !important; opacity: 1 !important; }
        }
    </style>
</head>
<body class="antialiased selection:bg-yellow-500 selection:text-white">

    <!-- Toile de fond animée (Neige) -->
    <canvas id="snow-canvas"></canvas>

    <div class="content-wrapper container mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-16 md:py-24 max-w-6xl">
        
        <!-- En-tête -->
        <header class="text-center mb-10 sm:mb-16 opacity-0 animate-fade-in-up">
            <div class="inline-block mb-3 sm:mb-4">
                <span class="text-3xl sm:text-4xl">✨</span>
            </div>
            <h1 class="text-4xl sm:text-5xl md:text-7xl font-serif font-bold mb-4 sm:mb-6 leading-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-yellow-400 to-amber-500 drop-shadow-sm">
                Ma Liste de Noël
            </h1>
            <p class="text-base sm:text-lg md:text-xl text-slate-300 max-w-2xl mx-auto font-light leading-relaxed">
                Chère famille, voici quelques idées si vous souhaitez me gâter cette année. 
                Bien sûr, rien n'est obligatoire, votre présence est déjà le plus beau des cadeaux ! Joyeuses fêtes à tous ! 🎄🎁
            </p>
        </header>

        <!-- Grille des cadeaux : 1 colonne mobile, 2 tablette, 3 ordinateur -->
        <div id="gifts-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6 lg:gap-8">
            <!-- Les cartes seront générées ici par JavaScript -->
        </div>

        <!-- Pied de page -->
        <footer class="mt-16 sm:mt-24 text-center text-slate-500 text-sm opacity-0 animate-fade-in-up" style="animation-delay: 0.5s;">
            <p>Fait avec ❤️ pour Noël • Hébergé sur GitHub Pages</p>
        </footer>

    </div>

    <!-- Script de gestion des données et des animations -->
    <script>
        /* =========================================================================
           1. VOS IDÉES DE CADEAUX (MODIFIEZ CETTE LISTE)
           ========================================================================= */
        const gifts = [
            {
                title: "Coque de téléphone Cars - Iphone 13 - Couleur: MSPC-RH10143B5",
                description: "Je suis dans ma période Cars en ce moment, pas de jugement",
                price: "~ 3,49€ hors livraison",
                image: "https://ae-pic-a1.aliexpress-media.com/kf/S427dd411539d493db5489aaf1a081966e.jpg_480x480q75.jpg_.webp",
                link: "https://fr.aliexpress.com/item/1005013397467646.html?pdp_ext_f=%7B%22sku_id%22%3A%2212000061024853989%22%7D&sourceType=1&spm=a2g0o.wish-manage-home.0.0&gatewayAdapt=glo2fra",
                tag: "Multimédia"
            },
            {
                title: "Décoration rotative de tableau de bord Flash McQueen",
                description: "J'aimerais le Flash McQueen.",
                price: "~ 4,99€ hors livraison",
                image: "https://i.ebayimg.com/images/g/Q2QAAeSwtZBp6oGT/s-l400.jpg",
                link: "https://fr.aliexpress.com/item/1005012439053996.html?pdp_ext_f=%7B%22sku_id%22%3A%2212000058402050933%22%7D&sourceType=1&spm=a2g0o.wish-manage-home.0.0&gatewayAdapt=glo2fra",
                tag: "Voiture"
            },
            {
                title: "Porte clef GTI",
                description: "Je ferais tout pour ma belle voiture.",
                price: "~ 3,99€ hors livraison",
                image: "https://ae-pic-a1.aliexpress-media.com/kf/Sd5d247fcde5b496da4488dd99cb746d1I.jpg_960x960q75.jpg_.avif",
                link: "https://www.boulanger.com/",
                tag: "Voiture"
            },
            {
                title: "Voiture de course Audi Revolut F1® Team R26",
                description: "Une de plus à la collection.",
                price: "Variable ~ 20€",
                image: "https://image.smythstoys.com/zoom/254329_1.webp",
                link: "https://ledenicheur.fr/product.php?p=16078547",
                tag: "Loisirs"
            },
            {
                title: "Voiture de course F1 ACADEMY™ LEGO®",
                description: "Bon peut être deux de plus à la collection finalement.",
                price: "Variable ~ 20€",
                image: "https://static.fnac-static.com/multimedia/Images/FR/MDM/74/b6/ba/29013620/1541-1/tsp20261016091832/LEGO-Speed-Champions-77258-Voiture-de-course-F1-ACADEMY-LEGO.jpg",
                link: "https://ledenicheur.fr/product.php?p=15908343",
                tag: "Loisirs"
            },
            {
                title: "Voiture de course de l’écurie APXGP tirée du film F1®",
                description: "Bon bref, on ne compte plus...Disponible seulement sur le site Lego, va disparaître bientôt.",
                price: "27,99€",
                image: "https://cdn.kiobi.com/images/brickwatch/sets/77252.png",
                link: "https://www.lego.com/fr-fr/product/apxgp-team-race-car-from-f1-the-movie-77252",
                tag: "  Loisirs"
            },
            {
                title: "Porsche GT3 RS",
                description: "Qui ne tente rien n'a rien.",
                price: "A partir de 253 454€",
                image: "https://pictures.porsche.com/rtt/iris?COSY-EU-100-1711coMvsi60AAt5FwcmBEgA4qP8iBUDxPE3Cb9pNXkBuNYdMGF4tl3U0%25z8rMHIspbWvanYb%255y%25oq%25vSTmjMXD4qAZeoNBPUSfUx4RmHlCgI7Zl2dioCxkF%25vUqCNwuWXsOw3meV6iTCj%25zhRc2GRdqAZ%25oD21P%25S1BAXmenugTfeIJpV7nDhQns",
                link: "https://configurator.porsche.com/fr-FR/mode/model/992850",
                tag: "  Voiture"
            }
        ];

        /* =========================================================================
           2. GÉNÉRATION DE L'INTERFACE
           ========================================================================= */
        const container = document.getElementById('gifts-container');

        gifts.forEach((gift, index) => {
            // On ajoute un délai d'animation pour qu'elles apparaissent une par une
            const delay = 0.1 * (index + 1);
            
            const cardHTML = `
                <div class="glass-card rounded-2xl overflow-hidden transition-all duration-300 opacity-0 animate-fade-in-up flex flex-col h-full" style="animation-delay: ${delay}s;">
                    <!-- Image -->
                    <div class="gift-image-container group">
                        <img src="${gift.image}" alt="${gift.title}" class="gift-image">
                        <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur text-xs font-semibold px-3 py-1 rounded-full text-yellow-400 border border-yellow-400/30 z-10">
                            ${gift.tag}
                        </div>
                    </div>
                    
                    <!-- Contenu -->
                    <div class="p-5 sm:p-6 flex flex-col flex-grow">
                        <div class="flex justify-between items-start mb-3">
                            <h2 class="text-lg sm:text-xl font-serif font-semibold text-white leading-tight pr-4 break-words">${gift.title}</h2>
                        </div>
                        
                        <p class="text-slate-400 text-sm mb-5 sm:mb-6 flex-grow leading-relaxed">
                            ${gift.description}
                        </p>
                        
                        <div class="flex flex-wrap items-center justify-between gap-3 mt-auto pt-4 border-t border-white/10">
                            <span class="text-yellow-400 font-medium text-sm sm:text-base">${gift.price}</span>
                            <a href="${gift.link}" target="_blank" rel="noopener noreferrer" class="bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 text-sm font-semibold py-2.5 px-5 rounded-full whitespace-nowrap hover:shadow-[0_0_15px_rgba(234,179,8,0.4)] transition-all transform hover:scale-105">
                                Voir l'article
                            </a>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });

        /* =========================================================================
           3. ANIMATION DE NEIGE SUR CANVAS
           ========================================================================= */
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let snowflakes = [];
        
        // Ajuster la taille du canvas à l'écran (net sur écrans HD)
        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initSnow();
        }
        
        // Création d'un flocon
        class Snowflake {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2 + 0.5; // Taille variable
                this.speedY = Math.random() * 1 + 0.5; // Vitesse de chute
                this.speedX = Math.random() * 0.5 - 0.25; // Dérive latérale légère
                this.opacity = Math.random() * 0.5 + 0.2; // Transparence
            }
            
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                
                if (this.y > height) {
                    this.y = 0 - this.radius;
                    this.x = Math.random() * width;
                }
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        // Initialiser la neige (densité selon la largeur, plafonnée pour rester fluide sur mobile)
        function initSnow() {
            const flakeCount = Math.min(Math.floor(width / 10), 120);
            snowflakes = [];
            for (let i = 0; i < flakeCount; i++) {
                snowflakes.push(new Snowflake());
            }
        }
        
        // Boucle d'animation
        function animateSnow() {
            ctx.clearRect(0, 0, width, height);
            snowflakes.forEach(flake => {
                flake.update();
                flake.draw();
            });
            requestAnimationFrame(animateSnow);
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resize, 150);
        });
        
        // Lancer la neige une fois la page chargée
        window.onload = () => {
            resize();
            animateSnow();
        };

    </script>
</body>
</html>
